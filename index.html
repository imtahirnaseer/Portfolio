<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Tahir Naseer</title>
<style>
  :root{
    --yellow:#FFDE59;
    --pink:#FF5FA2;
    --cyan:#5CE1E6;
    --black:#0d0d0d;
    --white:#f7f4ec;
    --border:5px;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    background:var(--yellow);
  }

  .grid-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(var(--black) 2px, transparent 2px),
      linear-gradient(90deg, var(--black) 2px, transparent 2px);
    background-size:44px 44px;
    opacity:0.1;
  }

  .shape{
    position:fixed;
    z-index:1;
    border:var(--border) solid var(--black);
  }

  .shape.circle{
    width:90px;
    height:90px;
    border-radius:50%;
    background:var(--pink);
    top:6%;
    left:5%;
  }

  .shape.square{
    width:70px;
    height:70px;
    background:var(--cyan);
    transform:rotate(18deg);
    top:8%;
    right:6%;
  }

  .shape.pill{
    width:120px;
    height:46px;
    border-radius:40px;
    background:var(--yellow);
    bottom:6%;
    right:5%;
    transform:rotate(-10deg);
  }

  /* Photo fills the frame, anchored bottom-center, always fully visible */
  .photo-stage{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    pointer-events:none;
  }

  .photo-stage img{
    height:88vh;
    max-height:88vh;
    width:auto;
    max-width:92vw;
    object-fit:contain;
    filter:drop-shadow(10px 10px 0 var(--black));
  }

  .container{
    position:relative;
    z-index:2;
    height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding:26px 18px 0;
    gap:18px;
    pointer-events:none;
  }

  .container > *{
    pointer-events:auto;
  }

  .headline-box{
    background:var(--white);
    border:var(--border) solid var(--black);
    box-shadow:10px 10px 0 var(--black);
    padding:18px 24px;
    max-width:600px;
    transform:rotate(-1.5deg);
  }

  .headline-box .top-line{
    font-size:clamp(0.8rem, 2.4vw, 1.1rem);
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--black);
    background:var(--cyan);
    display:inline-block;
    padding:3px 12px;
    border:3px solid var(--black);
    margin-bottom:10px;
  }

  h1{
    font-size:clamp(1.4rem, 5.5vw, 2.6rem);
    font-weight:900;
    text-transform:uppercase;
    line-height:1.08;
    color:var(--black);
    letter-spacing:0.5px;
  }

  h1 .highlight{
    display:inline-block;
    background:var(--pink);
    padding:2px 10px;
    margin-top:6px;
    border:4px solid var(--black);
    box-shadow:5px 5px 0 var(--black);
    transform:rotate(1deg);
  }

  .bottom-block{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:3;
    background:var(--black);
    border:var(--border) solid var(--black);
    box-shadow:8px 8px 0 var(--pink);
    padding:14px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    min-width:240px;
  }

  .progress-track{
    width:200px;
    max-width:55vw;
    height:14px;
    border:3px solid var(--white);
    background:var(--black);
    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    width:0%;
    background:repeating-linear-gradient(
      45deg,
      var(--yellow),
      var(--yellow) 10px,
      var(--pink) 10px,
      var(--pink) 20px
    );
    animation:fill 10s linear forwards;
  }

  @keyframes fill{
    to{width:100%;}
  }

  .status-text{
    color:var(--white);
    font-size:0.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  .status-text b{
    color:var(--yellow);
    font-size:1rem;
  }

  .skip-link{
    color:var(--black);
    text-decoration:none;
    font-weight:900;
    text-transform:uppercase;
    font-size:0.78rem;
    letter-spacing:1px;
    background:var(--yellow);
    border:3px solid var(--white);
    padding:8px 20px;
    box-shadow:4px 4px 0 var(--white);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .skip-link:hover{
    transform:translate(2px,2px);
    box-shadow:2px 2px 0 var(--white);
  }

  @media (max-width:640px){
    .photo-stage img{height:62vh; max-width:88vw;}
    .headline-box{padding:14px 18px;}
    .bottom-block{padding:12px 18px;}
    .shape.circle{width:55px;height:55px;}
    .shape.square{width:45px;height:45px;}
    .shape.pill{width:90px;height:34px;}
  }

  @media (max-height:640px){
    .photo-stage img{height:52vh;}
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="shape circle"></div>
<div class="shape square"></div>
<div class="shape pill"></div>

<div class="photo-stage">
  <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhlCQXBT5OEhxNOzUyZXJcsqUVVGBcZuMl5Gb-7CfcABqqkkrbHNBZjQDSsQ-iylJeyq5vGFGTuEGykolfxnuTz955tVodBXnDcBZJ-S-bshyex0IZznvqdxEZnv-Q6zDryX0VP_RecsaJCqc40YIlmZghTemC-f6gPSZStBrORm_YeqBSN-CQ1HIUExerR/s4096/deepjnfkjrf-removebg.png" alt="Tahir Naseer">
</div>

<div class="container">
  <div class="headline-box">
    <span class="top-line">Hey There</span>
    <h1>Welcome to<br><span class="highlight">Meet with Tahir Naseer</span></h1>
  </div>
</div>

<div class="bottom-block">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="status-text">Redirecting in <b id="countdown">05</b> sec</div>
  <a href="https://imtahirnaseer.vercel.app" class="skip-link">Skip Now →</a>
</div>

<script>
  const redirectURL = "https://imtahirnaseer.vercel.app";
  let seconds = 05;
  const countdownEl = document.getElementById('countdown');

  const timer = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(timer);
      countdownEl.textContent = 0;
      window.location.href = redirectURL;
    } else {
      countdownEl.textContent = seconds;
    }
  }, 1000);
</script>

</body>
</html>
