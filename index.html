<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Tahir Naseer</title>
<style>
  :root{
    --accent1:#7f5af0;
    --accent2:#2cb67d;
    --text:#ffffff;
    --muted:#d7d7e6;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:'Segoe UI', 'Poppins', Arial, sans-serif;
    background:#000;
  }

  .bg-photo{
    position:fixed;
    inset:0;
    background-image:
      url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhlCQXBT5OEhxNOzUyZXJcsqUVVGBcZuMl5Gb-7CfcABqqkkrbHNBZjQDSsQ-iylJeyq5vGFGTuEGykolfxnuTz955tVodBXnDcBZJ-S-bshyex0IZznvqdxEZnv-Q6zDryX0VP_RecsaJCqc40YIlmZghTemC-f6gPSZStBrORm_YeqBSN-CQ1HIUExerR/s4096/deepjnfkjrf-removebg.png');
    background-repeat:no-repeat;
    background-size:auto 92%;
    background-position:center bottom;
    filter:brightness(0.85) saturate(1.05);
    z-index:0;
  }

  .bg-solid{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 40%, #1b1035 0%, #0a0a14 70%);
    z-index:-1;
  }

  .overlay-gradient{
    position:fixed;
    inset:0;
    background:linear-gradient(
      to bottom,
      rgba(10,10,20,0.55) 0%,
      rgba(10,10,20,0.05) 30%,
      rgba(10,10,20,0.2) 65%,
      rgba(10,10,20,0.85) 100%
    );
    z-index:1;
  }

  .glow{
    position:fixed;
    inset:0;
    z-index:1;
    background:radial-gradient(circle at 50% 30%, rgba(127,90,240,0.25), transparent 60%);
    pointer-events:none;
  }

  .container{
    position:relative;
    z-index:2;
    height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding:48px 24px;
  }

  h1{
    font-size:clamp(1.6rem, 5vw, 3rem);
    font-weight:700;
    color:var(--text);
    text-shadow:0 4px 24px rgba(0,0,0,0.7);
    letter-spacing:0.5px;
    opacity:0;
    animation:fadeDown 0.9s ease forwards 0.2s;
  }

  h1 span{
    display:block;
    margin-top:6px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 2px 10px rgba(127,90,240,0.5));
  }

  @keyframes fadeDown{
    from{opacity:0; transform:translateY(-16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .bottom-panel{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 20px 22px;
    gap:12px;
  }

  .progress-track{
    width:220px;
    max-width:60vw;
    height:5px;
    border-radius:10px;
    background:rgba(255,255,255,0.15);
    overflow:hidden;
    backdrop-filter:blur(4px);
  }

  .progress-fill{
    height:100%;
    width:0%;
    border-radius:10px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    animation:fill 5s ease forwards;
  }

  @keyframes fill{
    to{width:100%;}
  }

  .status-text{
    color:var(--muted);
    font-size:0.85rem;
    letter-spacing:0.3px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }

  .status-text b{
    color:var(--text);
  }

  .skip-link{
    margin-top:6px;
    color:#fff;
    text-decoration:none;
    font-size:0.85rem;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.35);
    padding:9px 22px;
    border-radius:30px;
    backdrop-filter:blur(6px);
    transition:all 0.3s ease;
    opacity:0;
    animation:fadeDown 0.9s ease forwards 0.6s;
  }

  .skip-link:hover{
    background:rgba(127,90,240,0.35);
    box-shadow:0 0 18px rgba(127,90,240,0.5);
  }

  @media (max-width:480px){
    .bg-photo{background-size:auto 78%; background-position:center bottom;}
  }
</style>
</head>
<body>

<div class="bg-solid"></div>
<div class="bg-photo"></div>
<div class="glow"></div>
<div class="overlay-gradient"></div>

<div class="container">
  <h1>Welcome to<span>Meet with Tahir Naseer</span></h1>
</div>

<div class="bottom-panel">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="status-text">Redirecting in <b id="countdown">5</b> seconds...</div>
  <a href="https://imtahirnaseer.vercel.app" class="skip-link">Skip & Go Now →</a>
</div>

<script>
  const redirectURL = "https://imtahirnaseer.vercel.app";
  let seconds = 5;
  const countdownEl = document.getElementById('countdown');

  const timer = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(timer);
      countdownEl.textContent = 0;
      window.location.href = redirectURL;
    } else {
      countdownEl.textContent = seconds;
    }
  }, 1000);
</script>

</body>
</html>
